<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <title>Admin Login | VOX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #f4f1ea;
      --bg-soft: #fbfaf7;
      --card: #ffffff;
      --card-2: #fbfaf7;
      --border: #e7dfcf;
      --text: #1f1f23;
      --muted: #60606b;
      --accent: #ff6600;
      --accent-2: #ff8a33;
      --danger: #d04f4f;
      --shadow: 0 20px 50px rgba(26, 26, 35, 0.08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 102, 0, 0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(255, 138, 51, 0.08), transparent 22%),
        linear-gradient(180deg, #f4f1ea 0%, #fbfaf7 100%);
    }

    .screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.2rem;
    }

    .login-shell {
      width: min(100%, 420px);
      display: grid;
      gap: 1rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      justify-self: center;
      text-decoration: none;
      color: inherit;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      color: #140b02;
      font-weight: 800;
      box-shadow: 0 16px 30px rgba(255, 102, 0, 0.22);
    }

    .brand-copy {
      display: grid;
      gap: 0.05rem;
    }

    .brand-copy strong {
      font-size: 1.05rem;
      letter-spacing: 0.02em;
    }

    .brand-copy span {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 1.5rem;
      overflow: hidden;
      animation: rise 0.45s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      letter-spacing: -0.03em;
    }

    .card p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      line-height: 1.65;
    }

    .field {
      display: grid;
      gap: 0.45rem;
      margin-bottom: 0.9rem;
    }

    .field label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .input {
      width: 100%;
      padding: 0.95rem 1rem;
      border-radius: 14px;
      border: 1px solid rgba(231, 223, 207, 0.95);
      background: #fff;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .input:focus {
      outline: none;
      border-color: rgba(255, 102, 0, 0.8);
      box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.12);
      transform: translateY(-1px);
    }

    .input::placeholder {
      color: rgba(96, 96, 107, 0.4);
    }

    .password-wrap {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 0.75rem;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0.35rem;
    }

    .password-toggle:hover { color: var(--text); }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 0.98rem 1.1rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      color: #180b00;
      box-shadow: 0 14px 30px rgba(255, 102, 0, 0.22);
    }

    .message {
      min-height: 1.2rem;
      margin: 0.8rem 0 0;
      font-size: 0.9rem;
      color: var(--danger);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    @media (max-width: 480px) {
      .card { padding: 1.25rem; border-radius: 24px; }
      .meta { flex-direction: column; gap: 0.35rem; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="login-shell">
      <a class="brand" href="index.html">
        <span class="brand-mark">VOX</span>
        <span class="brand-copy">
          <strong>Admin Portal</strong>
          <span>Orders dashboard access</span>
        </span>
      </a>

      <section class="card">
        <h1>Admin Login</h1>
        <p>Sign in to manage orders, statuses, and exports.</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input class="input" id="username" name="username" type="text" placeholder="admin" autocomplete="username" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input class="input" id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
              <button class="password-toggle" id="toggle-password" type="button" aria-label="Show password">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <button class="btn btn-primary" type="submit">Login</button>
          <p class="message" id="login-message" aria-live="polite"></p>
        </form>

        <div class="meta">
          <span><i class="fa-solid fa-lock"></i> Secure local session</span>
          <span><i class="fa-solid fa-bag-shopping"></i> VOX orders only</span>
        </div>
      </section>
    </div>
  </main>

  <script>
    const SESSION_KEY = "vox_admin_session";
    const ATTEMPT_KEY = "vox_admin_attempts";
    const LOCKOUT_KEY = "vox_admin_lockout_until";
    const ADMIN_USERNAME = "admin";
    const ADMIN_SALT = "VOX_ADMIN_SALT_v1";
    const ADMIN_PASSWORD_HASH = "3f12feeeb969f6ff0540926aaec011e8b35ddf294af3cd232c9e1154645d70b8";
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_MS = 10 * 60 * 1000;
    const SESSION_MS = 30 * 60 * 1000;

    const form = document.getElementById("login-form");
    const message = document.getElementById("login-message");
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("toggle-password");

    if (isSessionValid()) {
      window.location.href = "admin-dashboard.html";
    }

    function safeJsonParse(value, fallback) {
      try {
        return value ? JSON.parse(value) : fallback;
      } catch {
        return fallback;
      }
    }

    function getLockoutUntil() {
      return Number(localStorage.getItem(LOCKOUT_KEY) || 0);
    }

    function isLockedOut() {
      const until = getLockoutUntil();
      return Number.isFinite(until) && until > Date.now();
    }

    function formatLockoutMessage() {
      const remainingMs = Math.max(0, getLockoutUntil() - Date.now());
      const remainingMinutes = Math.ceil(remainingMs / 60000);
      return `Too many failed attempts. Try again in ${remainingMinutes} minute${remainingMinutes === 1 ? "" : "s"}.`;
    }

    function isSessionValid() {
      const session = safeJsonParse(localStorage.getItem(SESSION_KEY), null);
      return Boolean(session && session.authenticated && Number(session.expiresAt || 0) > Date.now());
    }

    async function sha256(text) {
      const buffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buffer)).map((byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    togglePassword.addEventListener("click", () => {
      const isHidden = password.type === "password";
      password.type = isHidden ? "text" : "password";
      togglePassword.innerHTML = isHidden
        ? '<i class="fa-solid fa-eye-slash"></i>'
        : '<i class="fa-solid fa-eye"></i>';
      togglePassword.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (isLockedOut()) {
        message.textContent = formatLockoutMessage();
        return;
      }

      const username = form.username.value.trim();
      const enteredPassword = form.password.value;

      if (username !== ADMIN_USERNAME) {
        message.textContent = "Invalid credentials";
        return;
      }

      sha256(ADMIN_SALT + enteredPassword).then((hash) => {
        if (hash === ADMIN_PASSWORD_HASH) {
          localStorage.removeItem(ATTEMPT_KEY);
          localStorage.removeItem(LOCKOUT_KEY);
          localStorage.setItem(SESSION_KEY, JSON.stringify({
            authenticated: true,
            issuedAt: Date.now(),
            expiresAt: Date.now() + SESSION_MS,
          }));
          window.location.href = "admin-dashboard.html";
          return;
        }

        const attempts = Number(localStorage.getItem(ATTEMPT_KEY) || 0) + 1;
        localStorage.setItem(ATTEMPT_KEY, String(attempts));
        if (attempts >= MAX_ATTEMPTS) {
          localStorage.setItem(LOCKOUT_KEY, String(Date.now() + LOCKOUT_MS));
          localStorage.removeItem(ATTEMPT_KEY);
          message.textContent = formatLockoutMessage();
          return;
        }

        message.textContent = "Invalid credentials";
      }).catch(() => {
        message.textContent = "Login check failed. Please try again.";
      });
    });
  </script>
</body>
</html>
